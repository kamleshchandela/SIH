version: '3.8'

services:
  themis-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: themis-engine
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - THEMIS_DETERMINISTIC=1
      - JWT_SECRET=${JWT_SECRET:-themis-statutory-inspection-token-secret-2026}
      - THEMIS_ADMIN_PASSWORD=${THEMIS_ADMIN_PASSWORD:-admin@themis2026}
      - THEMIS_INSPECTOR_PASSWORD=${THEMIS_INSPECTOR_PASSWORD:-inspector@themis2026}
      - DATABASE_URL=postgres://themis:themis_secure_password@themis-db:5432/themis
    volumes:
      - ./themis/models:/app/models:ro
      - themis-data:/app/data
    depends_on:
      themis-db:
        condition: service_healthy

  themis-db:
    image: postgres:16-alpine
    container_name: themis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: themis
      POSTGRES_PASSWORD: themis_secure_password
      POSTGRES_DB: themis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U themis -d themis"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  themis-data:
  postgres-data:
